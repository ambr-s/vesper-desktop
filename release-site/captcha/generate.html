<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Vesper verification</title>
    <style>
      :root {
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      a {
        color: #7152ff;
        font-weight: 600;
      }
    </style>
    <script src="/captcha/vesper-captcha.js" defer></script>
    <script
      src="https://js.hcaptcha.com/1/api.js?onload=vesperCaptchaReady&render=explicit"
      async
      defer
    ></script>
  </head>
  <body>
    <main>
      <h1>Vesper verification</h1>
      <div id="captcha"></div>
      <p id="status">Loading verification…</p>
    </main>
  </body>
</html>
