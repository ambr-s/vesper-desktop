name: Build Vesper Desktop

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vesper-desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90

    steps:
      - name: Check out Vesper patchset
        uses: actions/checkout@v7

      - name: Validate patch tooling
        run: |
          python3 tools/test_export_patches.py -v
          python3 -m py_compile tools/export_patches.py tools/test_export_patches.py
          bash -n tools/export.sh tools/materialize.sh

      - name: Materialise Vesper
        run: ./tools/materialize.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: work/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: work/.nvmrc
          cache: pnpm
          cache-dependency-path: work/pnpm-lock.yaml

      - name: Cache Electron native builds
        uses: actions/cache@v6
        with:
          path: ~/.electron-gyp
          key: electron-gyp-${{ runner.os }}-${{ hashFiles('work/pnpm-lock.yaml') }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get install -y \
            dbus-daemon \
            flatpak \
            flatpak-builder \
            gnome-keyring \
            libglib2.0-bin \
            libpulse0 \
            xvfb ||
            (
              sudo apt-get update &&
              sudo apt-get install -y \
                dbus-daemon \
                flatpak \
                flatpak-builder \
                gnome-keyring \
                libglib2.0-bin \
                libpulse0 \
                xvfb
            )

      - name: Build and validate Vesper
        run: ./tools/build-local.sh

      - name: Build and test Flatpak
        run: |
          ./tools/build-flatpak.sh
          ./tools/test-flatpak.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: vesper-desktop-linux-x64
          path: |
            work/release/vesper-desktop_*_amd64.deb
            work/release/vesper-desktop_*_x86_64.AppImage
            work/release/vesper-desktop_*_x86_64.AppImage.blockmap
            work/release/latest-linux.yml
            artifacts/flatpak/vesper-desktop_*_x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
